<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Conecta Flow · Parte 1</title>
<!-- Tokens de marca «El Talonario» (GENERADO por build-tokens.mjs desde src/styles/theme.ts —
     no editar los hex a mano; los copia frescos new-tour.mjs desde _brand/). -->
<link rel="stylesheet" href="assets/brand.tokens.css">
<!-- Kit compartido de tours (fuente: hyperframes/_lib/tour-kit.css). No editar acá:
     los fixes van a _lib/ y llegan a los videos nuevos vía new-tour.mjs. -->
<link rel="stylesheet" href="assets/tour-kit.css">
<style>
  /* ==== Fuentes de marca (design.md §3): Fraunces · Bricolage 800 · Instrument Sans · IBM Plex Mono ====
     PELADO: el `src` es `assets/fonts/<Familia>.woff2` — token root-relative que el lint acepta
     (NO `../` fuera del root → invalid_parent_traversal). Ese path NO existe en disco: no hay
     base64 en git ni `assets/fonts/` per-video. En render-time `render.mjs` reemplaza cada url()
     por data:base64 en una copia efímera (index.embed.html), con los bytes de la fuente ÚNICA
     `_brand/fonts/` (el motor de captura no resuelve url() a woff2 externo → gotcha 12).
     Se dejan INLINE para que el lint vea las familias declaradas. */
  @font-face { font-family: "Fraunces"; src: url("assets/fonts/Fraunces-Variable.woff2") format("woff2"); font-weight: 400 900; font-display: block; }
  @font-face { font-family: "Bricolage Grotesque"; src: url("assets/fonts/BricolageGrotesque-Variable.woff2") format("woff2"); font-weight: 200 800; font-display: block; }
  @font-face { font-family: "Instrument Sans"; src: url("assets/fonts/InstrumentSans-Variable.woff2") format("woff2"); font-weight: 400 700; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
  @font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }

  /* Escenario: gris banda del talonario, texto tinta, acento cobalto. */
  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--st-stage); font-family: var(--st-font-texto);
  }

  /* ══════════════════════════════════════════════════════════════════════════
     CLASES ESPECÍFICAS DE ESTE VIDEO.
     (Lo genérico —browser frame, tooltip, spotlight, cursor— viene de
      assets/tour-kit.css. No lo redefinas.)

     RECORDATORIO (gotcha 9): app.js NO puede poner tipografía/gap/flex inline —
     el renderer los descarta. app.js sólo asigna clases + geometría.

     CERO HEX (I7): todo color por token var(--st-*).
     ══════════════════════════════════════════════════════════════════════════ */

  /* ── Screenshots REALES del sitio de Flow (los 3 pasos) ────────────────────
     Flow es un sitio de TERCEROS: no se mockea, se muestra el shot recortado
     encajado en el viewport del chrome del kit. En el paso 3 conviven DOS
     shots en la misma caja (crossfade Datos del negocio → Datos bancarios).
     app.js pone width/height inline (geometría, sobrevive al gotcha 9); acá va
     el contenedor que recorta y el reset de la imagen. */
  .cf-viewport {
    position: relative; flex: 1; min-height: 0; overflow: hidden;
    background: var(--st-superficie);
  }
  .cf-shot { position: absolute; display: block; }

</style>
</head>
<body>
<!-- Duración total = data-duration del root. Clips: data-start/data-duration en
     SEGUNDOS, sin overlap en el mismo track (el lint lo bloquea). Los calculó
     new-tour.mjs borde a borde a partir de --beats.

     PARTE 1 DE UNA CADENA DE 2: este MP4 se concatena con `conecta-flow-b`
     (ffmpeg concat, mismo códec/fps) → out/YYYY-MM-DD-conecta-flow.mp4. -->
<div id="root" data-composition-id="conecta-flow-a" data-width="1920" data-height="1080" data-fps="30" data-start="0" data-duration="38.5000">

  <!-- 1. POSTER — frame 0 legible (sin animación de entrada; el thumbnail sale de acá). -->
  <section id="b-intro" class="clip beat center-col" data-start="0.0000" data-duration="5.0000" data-track-index="0" style="gap:22px;">
    <svg width="112" height="112" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="15" class="iso-caja"/>
      <rect x="17" y="45" width="30" height="6" rx="3" class="iso-barra"/>
      <text x="32" y="30" font-size="40" class="iso-letra">S</text>
    </svg>
    <div class="eyebrow" style="margin-top:6px;">Parte 1 · Crea tu cuenta</div>
    <div class="headline" style="font-size:72px; text-align:center; max-width:1340px;"><span class="plumon">Conecta</span> Flow</div>
    <div class="lead" style="font-size:30px;">Cobra con tu propia cuenta. Sin intermediarios.</div>
  </section>

  <!-- 2. CONCEPTO — qué es / qué resuelve (una idea, sin hype). -->
  <section id="b-concept" class="clip beat center-col" data-start="5.0000" data-duration="5.5000" data-track-index="0" style="gap:26px; padding:0 8%; opacity:0;">
    <div class="eyebrow">Cómo funciona</div>
    <div class="headline" style="font-size:62px; text-align:center; max-width:1320px;">Tu cuenta de Flow, tus ventas</div>
    <div class="lead">Flow procesa el pago y deposita en la cuenta bancaria registrada. La plataforma nunca toca el dinero.</div>
  </section>

  <!-- 3-5. PASOS del tour — navegador + screenshot de Flow + overlays (los llena app.js). -->
  <section id="step-0" class="clip beat" data-start="10.5000" data-duration="7.5000" data-track-index="0" style="opacity:0;">
    <div id="step-0-stage" class="wt-stage"></div>
  </section>
  <section id="step-1" class="clip beat" data-start="18.0000" data-duration="7.5000" data-track-index="0" style="opacity:0;">
    <div id="step-1-stage" class="wt-stage"></div>
  </section>
  <section id="step-2" class="clip beat" data-start="25.5000" data-duration="8.0000" data-track-index="0" style="opacity:0;">
    <div id="step-2-stage" class="wt-stage"></div>
  </section>

  <!-- 6. OUTRO BISAGRA (sube con wipe): cierra la Parte 1 y entrega a la Parte 2.
       Sin lockup: el cierre de la cadena está en el outro de la Parte 2. -->
  <section id="b-outro" class="clip beat" data-start="33.5000" data-duration="5.0000" data-track-index="0" style="transform:translateY(1080px);">
    <div class="paper-bg"></div>
    <div class="paper-edge"></div>
    <div class="beat center-col" style="gap:34px; padding:0 8%;">
      <div id="outro-head" class="center-col" style="gap:16px; opacity:0; transform:translateY(16px);">
        <div class="eyebrow">Sortéatelo</div>
        <div class="headline" style="font-size:66px; text-align:center; max-width:1360px;">Cuenta <span class="plumon">lista</span>.</div>
        <div class="lead" style="font-size:26px; margin-top:8px;">Ahora, las claves de integración.</div>
      </div>
    </div>
  </section>

</div>
<script src="assets/gsap.min.js"></script>
<script src="assets/tour-kit.js"></script>
<script src="app.js"></script>
<!-- El timeline DEBE quedar INLINE acá (el guard estático no ve .js externos → si lo
     sacás, el render se bloquea con missing_timeline_registry). Corre después de
     app.js: los IDs (#cursor-N, #spot-N, #tip-N, #shot-*) y window.TOUR ya existen. -->
<script>
(() => {
  const f = (n) => n / 30;            // frames @30fps → segundos
  const N = { ease: "none" };         // interpolación lineal
  const OUT = { ease: "power2.out" }; // movimiento de cursor
  const tl = gsap.timeline({ paused: true });

  // Puntos de geometría: los define app.js (misma fuente que los shots) → cursor,
  // spotlight y tooltip quedan alineados POR CONSTRUCCIÓN, nunca a ojo.
  const P = window.TOUR.P;

  // ==== 1. POSTER: frame 0 legible; sólo anima la SALIDA ====
  tl.to("#b-intro", { opacity: 0, duration: f(16), ...N }, f(134));

  // ==== 2. CONCEPTO: fade in + subida; fade out al final ====
  tl.fromTo("#b-concept", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: f(18), ...N }, f(150));
  tl.to("#b-concept", { opacity: 0, duration: f(16), ...N }, f(299));

  // ==== 3. PASO 1 — flow.cl: el link «Crea tu cuenta» del nav ====
  const S0 = 315;
  tl.fromTo("#step-0", { opacity: 0 }, { opacity: 1, duration: f(16), ...N }, f(S0));
  tl.set("#step-0", { opacity: 0 }, f(S0 + 225));
  tl.set("#cursor-0", { x: P.start.x, y: P.start.y }, f(S0));
  tl.fromTo("#cursor-0", { opacity: 0 }, { opacity: 1, duration: f(14), ...N }, f(S0 + 10));
  tl.to("#cursor-0", { x: P.p0.x, y: P.p0.y, duration: f(44), ...OUT }, f(S0 + 8));
  tl.fromTo("#spot-0", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S0 + 26));
  tl.fromTo("#tip-0", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S0 + 40));
  // click al FINAL del beat: abre el formulario de registro — la página del paso 2
  tl.fromTo("#cursor-0-ring", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 0.95, duration: f(7), ease: "power1.out" }, f(S0 + 190));
  tl.to("#cursor-0-ring", { opacity: 0, scale: 1.4, duration: f(7), ...N }, f(S0 + 197));
  tl.to("#tip-0", { opacity: 0, duration: f(16), ...N }, f(S0 + 225 - 16));

  // ==== 4. PASO 2 — registro (el cursor ARRANCA donde terminó el paso 1) ====
  // Sin click: el alta termina con el correo de activación, fuera del video.
  const S1 = 540;
  tl.set("#step-1", { opacity: 1 }, f(S1));
  tl.set("#step-1", { opacity: 0 }, f(S1 + 225));
  tl.set("#cursor-1", { x: P.p0.x, y: P.p0.y, opacity: 1 }, f(S1));
  tl.fromTo("#spot-1", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S1 + 10));
  tl.fromTo("#tip-1", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S1 + 30));
  tl.to("#cursor-1", { x: P.p1.x, y: P.p1.y, duration: f(60), ...OUT }, f(S1 + 60));
  tl.to("#tip-1", { opacity: 0, duration: f(16), ...N }, f(S1 + 225 - 16));

  // ==== 5. PASO 3 — Configuración: Datos del negocio → Datos bancarios ====
  // El crossfade de shots a mitad de beat es el mismo patrón de los stackEl: -a sale, -b entra.
  const S2 = 765;
  tl.set("#step-2", { opacity: 1 }, f(S2));
  tl.set("#step-2", { opacity: 0 }, f(S2 + 240));
  tl.set("#cursor-2", { x: P.p1.x, y: P.p1.y, opacity: 1 }, f(S2));
  tl.to("#cursor-2", { x: P.p2.x, y: P.p2.y, duration: f(44), ...OUT }, f(S2 + 6));
  tl.fromTo("#spot-2", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S2 + 16));
  tl.fromTo("#tip-2", { opacity: 0 }, { opacity: 1, duration: f(18), ...N }, f(S2 + 34));
  // click en el menú → la segunda sección obligatoria
  tl.fromTo("#cursor-2-ring", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 0.9, duration: f(7), ease: "power1.out" }, f(S2 + 112));
  tl.to("#cursor-2-ring", { opacity: 0, scale: 1.4, duration: f(7), ...N }, f(S2 + 119));
  tl.to("#shot-flow-datos-negocio", { opacity: 0, duration: f(10), ...N }, f(S2 + 120));
  tl.fromTo("#shot-flow-datos-bancarios", { opacity: 0 }, { opacity: 1, duration: f(10), ...N }, f(S2 + 120));
  tl.to("#tip-2", { opacity: 0, duration: f(16), ...N }, f(S2 + 240 - 16));

  // ==== 6. OUTRO BISAGRA: wipe vertical + head (sin lockup: sigue la Parte 2) ====
  const OS = 1005;
  tl.fromTo("#b-outro", { y: 1080 }, { y: 0, duration: f(28), ease: "power2.inOut" }, f(OS));
  tl.fromTo("#outro-head", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: f(20), ...N }, f(OS + 26));

  window.__timelines = window.__timelines || {};
  window.__timelines["conecta-flow-a"] = tl; // key = data-composition-id del root
})();
</script>
</body>
</html>
